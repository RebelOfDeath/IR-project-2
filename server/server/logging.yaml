version: 1
disable_existing_loggers: False
filters:
  correlation_id:
    "()": server.filters.CorrelationIdFilter
    default_value: "0"
formatters:
  default:
    # "()": uvicorn.logging.DefaultFormatter
    format: '%(asctime)s - %(name)s - %(levelname)s - %(correlation_id)s - %(message)s'
  access:
    # "()": uvicorn.logging.AccessFormatter
    format: '%(asctime)s - %(name)s - %(levelname)s - %(correlation_id)s - %(message)s'
handlers:
  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
    filters:
      - correlation_id
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
    filters:
      - correlation_id
loggers:
  server:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.error:
    level: INFO
    handlers:
      - default
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
    propagate: no
  httpx:
    level: WARN
    handlers:
      - default
    propagate: no
root:
  level: INFO
  handlers:
    - default
  propagate: no