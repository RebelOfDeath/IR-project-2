[tool.poetry]
name = "ase2025-server"
version = "0.1.0"
description = "Server part of the evaluation platform for Co4 competition."
authors = ["Egor Bogomolov <egor.bogomolov@jetbrains.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^2.2.5"
jsonlines = "^4.0.0"
openai = "^1.76.0"
fastapi = "^0.115.12"
uvicorn = "^0.34.2"
python-multipart = "^0.0.20"
mistralai = "^1.7.0"
python-dotenv = "^1.1.0"
transformers = "^4.51.3"
mistral-common = "^1.5.4"
anyio = "^4.9.0"
vllm = {version = "^0.6.0", optional = true}
torch = {version = "^2.0.0", optional = true}

[tool.poetry.extras]
local = ["vllm", "torch"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
